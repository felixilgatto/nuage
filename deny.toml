# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
#
# Nuage is MIT-licensed. Only MIT-compatible licenses are accepted:
# MIT, Apache-2.0, BSD, ISC, Zlib (plus Unicode-3.0 for unicode tables).
# MPL-2.0 is accepted case by case through `exceptions`; GPL/AGPL never.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # zvariant / zbus_names / zvariant_derive were merged into zbus 6.
    # They come from zbus 5 through ksni (tray only, never in nuaged/nuage);
    # no upgrade is possible until ksni moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zbus 5 via ksni, tray only; waiting for ksni on zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus 5 via ksni, tray only; waiting for ksni on zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zbus 5 via ksni, tray only; waiting for ksni on zbus 6" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# The list mirrors the project policy even where no crate uses a license yet.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
# Case-by-case exceptions (MPL-2.0 and other permissive licenses).
exceptions = [
    # Public-domain dedication, compatible with MIT. Tray icon crate chosen by
    # the project (desktop app only).
    { allow = ["Unlicense"], crate = "ksni" },
    # Permissive data license of the Mozilla CA certificate bundle, pulled by
    # rustls-platform-verifier (reqwest).
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies have no version requirement; that is fine.
allow-wildcard-paths = true
deny = [
    # Use rustls (with the `ring` provider) everywhere, never OpenSSL.
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "native-tls", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
