name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # rclone version bundled with Nuage; the end-to-end tests run against it.
  # Not named RCLONE_VERSION: rclone reads every RCLONE_* variable as a flag.
  NUAGE_RCLONE_VERSION: v1.75.2

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install GTK 4 and libadwaita development files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev pkg-config jq fuse3

      - name: Install rclone
        run: |
          cd "$RUNNER_TEMP"
          zip="rclone-$NUAGE_RCLONE_VERSION-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/$NUAGE_RCLONE_VERSION/$zip"
          curl -fsSL "https://downloads.rclone.org/$NUAGE_RCLONE_VERSION/SHA256SUMS" | grep " $zip\$" | sha256sum -c -
          unzip -q "$zip"
          echo "NUAGE_RCLONE=$RUNNER_TEMP/${zip%.zip}/rclone" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests (including end-to-end tests with rclone and FUSE)
        run: cargo test --workspace
        env:
          # Fail instead of skipping the end-to-end tests.
          NUAGE_E2E_REQUIRED: "1"

      - name: Dependency rules between crates
        run: scripts/check-deps.sh

      - name: Licenses, advisories, duplicates
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  native:
    # Headless packages: static binaries (no GTK), tarball and .deb, tested in
    # clean containers.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: native

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fuse3 jq

      - name: Build the tarball and the .deb
        run: scripts/build-native.sh

      - name: End-to-end tests against the static nuaged
        run: cargo test -p nuage --test e2e
        env:
          NUAGE_TEST_NUAGED: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/nuaged
          NUAGE_RCLONE: ${{ github.workspace }}/target/rclone/rclone
          NUAGE_E2E_REQUIRED: "1"

      - name: Install the .deb in clean containers
        run: |
          for image in ubuntu:24.04 debian:12; do
            echo "::group::$image"
            docker run --rm --device /dev/fuse --cap-add SYS_ADMIN \
              --security-opt apparmor:unconfined \
              -v "$PWD/target/dist:/dist:ro" -v "$PWD/scripts:/scripts:ro" \
              "$image" /scripts/smoke-native.sh
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nuage-native
          path: target/dist/

  flatpak:
    # The desktop application: offline build of the manifest, bundle as an
    # artifact, and the Flathub linter.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      - name: cargo-sources.json matches Cargo.lock
        run: |
          python3 scripts/cargo-sources.py
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code build-aux/flatpak/cargo-sources.json \
            || { echo "::error::Regenerate it: scripts/cargo-sources.py"; exit 1; }

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: nuage.flatpak
          manifest-path: build-aux/flatpak/io.github.felixilgatto.Nuage.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}
          upload-artifact: true

      - name: Flathub linter
        # Fails on anything but the exceptions accepted for v1 (see the script).
        run: scripts/flatpak-lint.sh repo
