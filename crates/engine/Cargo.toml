[package]
name = "nuage-engine"
description = "Nuage engine: accounts, mounts, uploads, exclusions, status aggregation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The providers ready for users: those of nuage-providers' `default`, so that
# adding a provider does not touch this crate. Builds with other providers
# disable the default features and enable `nuage-providers/<id>`.
default = ["default-providers"]
default-providers = ["nuage-providers/default"]

[dependencies]
chrono.workspace = true
nuage-core.workspace = true
nuage-fs.workspace = true
nuage-providers.workspace = true
nuage-rclone.workspace = true
oo7.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
