[package]
name = "nuage-providers"
description = "Nuage storage providers: the Provider trait, the registry and one module per provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["local", "gdrive", "onedrive", "dropbox", "pcloud", "nextcloud", "webdav", "s3"]
# One feature per provider. The registry only contains enabled providers.
local = []
gdrive = []
onedrive = []
dropbox = []
pcloud = []
nextcloud = []
webdav = []
s3 = []
# Experimental: rclone's Proton Drive backend is in beta.
protondrive = []

[dependencies]
nuage-core.workspace = true

[lints]
workspace = true
