[package]
name = "nuaged"
description = "Nuage daemon: runs the engine and serves clients over a Unix socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "nuaged"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
nuage-core.workspace = true
nuage-engine.workspace = true
nuage-ipc.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Debian package of the headless install (`scripts/build-native.sh`).
[package.metadata.deb]
name = "nuage"
maintainer = "felixilgatto <felix.capuano@gmail.com>"
copyright = "Nuage contributors"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "fuse3"
extended-description = """\
Nuage mounts cloud storage accounts (Google Drive…) as local folders, with \
a local cache, pause and resume of uploads, and a status report. This \
package contains the daemon (nuaged), the command-line tool (nuage) and the \
bundled rclone; it has no graphical dependency."""
assets = [
    ["target/release/nuaged", "usr/bin/", "755"],
    ["target/release/nuage", "usr/bin/", "755"],
    ["../../target/rclone/rclone", "usr/lib/nuage/", "755"],
    ["../../build-aux/native/nuaged.service", "usr/lib/systemd/user/", "644"],
    ["../../README.md", "usr/share/doc/nuage/", "644"],
    ["../../docs/SERVER.md", "usr/share/doc/nuage/", "644"],
    ["../../docs/GOOGLE_OAUTH.md", "usr/share/doc/nuage/", "644"],
    ["../../docs/CLI.md", "usr/share/doc/nuage/", "644"],
    ["../../docs/TROUBLESHOOTING.md", "usr/share/doc/nuage/", "644"],
    ["../../target/rclone/COPYING", "usr/share/doc/nuage/rclone-COPYING", "644"],
]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
